# ==============================================================================
# SukiSU Kernel CI — OPPO MSM8937 系列（R9s / A57 / R9s Plus / R9 Plus）
# ------------------------------------------------------------------------------
# 通用内核：同一个包同时适用于 LineageOS 21 / 22.0 / 22.1（Android 14 / 15）。
#   · 不再按系统版本切分支：一份产物刷三个系统版本，编译一次即可
#     （依据：三分支源码树一致、四个机型 defconfig 一致，实测产物仅 1185 字节差
#      异且全部来自构建时间戳与随机签名密钥，无功能差异）
#   · 仅支持手动触发（Actions 页 Run workflow），可点选机型 / 是否发布
#   · 并行编译 4 个机型带 SukiSU 的内核 → AnyKernel3 打包
#   · 一次构建合并为 1 个 Release，包含全部机型 zip 资产
#   · 命名：SukiSU_机型_8位日期.zip（例：SukiSU_R9s_20260817.zip）
#   · Release 标题不含系统版本号，形如「OPPO Kernel SukiSU + SUSFS 2.3.0」
#     （SUSFS 版本号从 include/linux/susfs.h 动态读取，升级后不会写死过时）
#   · Release 正文：底部自动追加 Changes（最近提交，提交标题 (短哈希)）
#
# 分支：唯一开发分支 sukisu-susfs-bpf（默认分支），一份产物通刷 LOS21/22.0/22.1
#
# 编译加速（相对旧版）：
#   1. Clang 工具链改用 actions/cache 缓存，省去每次 4 个矩阵任务的重复下载解压
#   2. apt 安装改为「先装、失败再 update」，命中镜像预置索引时省掉一次 apt-get update
#   3. ccache 加 restore-keys，允许跨机型复用共享目标文件；开启 time_macros 容忍度
#   4. 只编译 Image.gz-dtb 目标（含 dtbs），不再跑全量 make
# ==============================================================================

name: Build SukiSU Kernel & Release

on:
  workflow_dispatch:
    inputs:
      devices:
        description: '要构建的机型，逗号分隔（留空 = 全部 4 个）：R9s,A57,R9sPlus,R9Plus'
        required: false
        type: string
        default: ''
      publish_release:
        description: '是否发布到 GitHub Releases（否：仅上传构建产物）'
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz
  # 通用内核支持的系统版本（不参与分支解析，仅用于 Release 说明）
  OS_SUPPORT: 'LineageOS 21 / 22.0 / 22.1'
  ANDROID_SUPPORT: '14 / 15'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: setup —— 生成机型构建矩阵与构建元信息
  # ---------------------------------------------------------------------------
  setup:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      devices_json: ${{ steps.gen.outputs.devices_json }}
      device_list: ${{ steps.gen.outputs.device_list }}
      build_date: ${{ steps.gen.outputs.build_date }}
      ksu_version: ${{ steps.gen.outputs.ksu_version }}
      publish: ${{ steps.gen.outputs.publish }}
    steps:
      - name: Generate matrix & metadata
        id: gen
        run: |
          set -euo pipefail

          # ---- 0. 分支说明：通用内核，唯一开发分支为 sukisu-susfs-bpf ----
          BRANCH="${GITHUB_REF_NAME}"
          echo "branch=${BRANCH}"
          if [[ "${BRANCH}" != "sukisu-susfs-bpf" ]]; then
            echo "::warning::当前分支 '${BRANCH}' 不是 sukisu-susfs-bpf。"
            echo "::warning::通用内核以 sukisu-susfs-bpf 为唯一开发分支，一份产物通刷 LOS21/22.0/22.1。"
          fi

          # ---- 1. 编译日期（8 位）----
          BUILD_DATE="$(date +'%Y%m%d')"

          # ---- 2. SukiSU / SUSFS 版本：统一以仓库内的定义为准，不在这里联网查
          #      （api.github.com 限流时旧逻辑会静默退成 4.1.3，导致 Release 写错版本）。
          #      setup 没有 checkout，这里只给兜底值，真实值由 build 任务从源码解析后
          #      写进 meta.env 供 release 任务使用。
          KSU_VERSION="4.2.0"

          # ---- 3. 机型矩阵（device / label / defconfig / 设备名 / 平台 / SoC 商用名）----
          python3 - "${{ inputs.devices }}" <<'PYEOF' > matrix.json
          import json, os, sys
          devices = [
              {"device": "R9s",     "label": "R9s",       "defconfig": "lineageos_R9s_defconfig",
               "device_names": "r9s|R9s|16017|16027|msm8953",   "soc": "MSM8953",
               "snapdragon": "Snapdragon 625"},
              {"device": "A57",     "label": "A57",       "defconfig": "lineageos_A57_defconfig",
               "device_names": "a57|A57|16061|msm8937|msm8940", "soc": "MSM8937/MSM8940",
               "snapdragon": "Snapdragon 430/435"},
              {"device": "R9sPlus", "label": "R9s Plus",  "defconfig": "lineageos_R9sPlus_defconfig",
               "device_names": "r9splus|R9sPlus|16037|msm8976",  "soc": "MSM8976",
               "snapdragon": "Snapdragon 652"},
              {"device": "R9Plus",  "label": "R9 Plus",   "defconfig": "lineageos_R9Plus_defconfig",
               "device_names": "r9plus|R9Plus|15103|msm8976",   "soc": "MSM8976",
               "snapdragon": "Snapdragon 652"},
          ]
          if len(sys.argv) > 1 and sys.argv[1].strip():
              want = [s.strip() for s in sys.argv[1].split(",") if s.strip()]
              devices = [d for d in devices if d["device"] in want]
          print(json.dumps({"include": devices}))
          PYEOF

          MATRIX="$(cat matrix.json)"
          INCLUDED=$(python3 -c 'import json;print(json.dumps(json.load(open("matrix.json"))["include"]))')
          DEVICE_LIST=$(python3 -c 'import json;print(" ".join(x["device"] for x in json.load(open("matrix.json"))["include"]))')

          echo "::group::Build matrix"
          echo "${MATRIX}"
          echo "::endgroup::"
          echo "matrix=${MATRIX}"                    >> "$GITHUB_OUTPUT"
          echo "devices_json=${INCLUDED}"            >> "$GITHUB_OUTPUT"
          echo "device_list=${DEVICE_LIST}"          >> "$GITHUB_OUTPUT"
          echo "BUILD_DATE=${BUILD_DATE}"            >> "$GITHUB_OUTPUT"
          echo "KSU_VERSION=${KSU_VERSION}"          >> "$GITHUB_OUTPUT"
          echo "publish=${{ inputs.publish_release && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

          echo "BRANCH=${BRANCH} | BUILD_DATE=${BUILD_DATE} | KSU_VERSION=${KSU_VERSION} | devices=${DEVICE_LIST}"

  # ---------------------------------------------------------------------------
  # Job 2: build —— 按矩阵并行编译内核 + AK3 打包 + 上传产物
  # ---------------------------------------------------------------------------
  build-kernel:
    name: "${{ matrix.device }}"
    needs: setup
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      DEVICE: ${{ matrix.device }}
      DEFCONFIG: ${{ matrix.defconfig }}
      DEVICE_NAMES: ${{ matrix.device_names }}
      SOC: ${{ matrix.soc }}
      SNAPDRAGON: ${{ matrix.snapdragon }}
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      KSU_VERSION: ${{ needs.setup.outputs.ksu_version }}
      # 说明：KernelSU 的 manager/ 目录必须随仓库一起提交（apk_sign.h / pkg_observer.h 等为编译所必需），
      # 不再从 sukisu-ultra 远程拉取补齐——远程 tag 的布局/版本与仓库内定制源码不一致，会导致编译失败。
      # 包名不含系统版本：同一个包通刷 LOS21 / 22.0 / 22.1。
      ZIP_NAME: SukiSU_${{ matrix.device }}_${{ needs.setup.outputs.build_date }}.zip
      # ccache 调优：压缩存储；忽略 __DATE__/__TIME__ 展开（KBUILD_BUILD_TIMESTAMP
      # 每次构建都不同，不设这个会让几乎所有目标文件缓存未命中——这是最大的提速点）。
      # 注意不要用 compilercheck=content：那会在每次调用时哈希整个 clang 二进制，
      # 反而拖慢编译；工具链已用 actions/cache 缓存，mtime 跨构建稳定，默认 mtime 即可。
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: '1'
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: 设置 10G swap（内核编译内存保障）
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 50          # 拉取最近提交，供 Release 底部的 Changes 使用
          path: kernel

      # drivers/kernelsu 是指向根目录 KernelSU/kernel 的符号链接；
      # manager/ 目录（apk_sign.h / pkg_observer.h 等）必须随仓库提交，这里仅做完整性校验。
      # 更新 KernelSU 源码时请把配套的 manager/ 文件一并提交，否则编译会在此处直接报错。
      - name: 校验 KernelSU manager 目录（已随仓库提交）
        working-directory: kernel
        run: |
          set -euo pipefail
          REQUIRED=(
            KernelSU/kernel/manager/apk_sign.c
            KernelSU/kernel/manager/apk_sign.h
            KernelSU/kernel/manager/manager_identity.h
            KernelSU/kernel/manager/manager_observer.h
            KernelSU/kernel/manager/pkg_observer.c
            KernelSU/kernel/manager/pkg_observer.h
            KernelSU/kernel/manager/pkg_observer_compat.h
            KernelSU/kernel/manager/throne_tracker.c
            KernelSU/kernel/manager/throne_tracker.h
          )
          MISSING=""
          for f in "${REQUIRED[@]}"; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::KernelSU manager 目录不完整，缺失:$MISSING"
            echo "::error::请将 KernelSU/kernel/manager/ 与 KernelSU 源码一同提交进仓库（勿从 sukisu-ultra 拉取，版本不匹配会编译失败）"
            exit 1
          fi
          echo "✅ KernelSU manager 目录完整（9 个必需文件）"

      - name: 安装编译依赖
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # 本步骤所需包均在 Ubuntu 官方源内，删除可能挂死的第三方 PPA 源，避免 apt-get update 卡住
          sudo rm -f /etc/apt/sources.list.d/*.list
          # apt 加固：HTTP/HTTPS/FTP 超时 + 自动重试，防止镜像挂起把 job 拖到 6 小时超时被取消
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ftp::Timeout=30"
          PKGS="build-essential bc bison flex \
            libssl-dev libncurses-dev libfl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio lz4 lzop zstd zip unzip \
            device-tree-compiler ccache python3 \
            pngcrush schedtool liblz4-tool libxml2-utils xsltproc squashfs-tools"
          # 加速：GitHub 镜像已预置 apt 索引，先直接安装；只有失败时才更新索引重试。
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${APT_OPTS} ${PKGS}; then
            echo "✅ 依赖已安装（跳过 apt-get update）"
          else
            echo "⚠️ 直接安装失败，更新索引后重试"
            UPDATED=0
            for i in 1 2 3; do
              if sudo apt-get update ${APT_OPTS}; then
                UPDATED=1
                break
              fi
              echo "⚠️ apt-get update 第 ${i} 次失败，5 秒后重试"
              sleep 5
            done
            [ "${UPDATED}" = "1" ] || { echo "::error::apt-get update 连续 3 次失败，请检查网络"; exit 1; }
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${APT_OPTS} ${PKGS}
          fi

      # 加速：工具链体积不大但解压慢，缓存后 4 个矩阵任务只有首个真正下载
      - name: 缓存 Clang 13 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain
          key: clang-13.0.1-20230207-${{ runner.os }}-${{ runner.arch }}

      - name: 下载 Clang 13 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q --show-progress "${CLANG_URL}" -O clang.tar.gz
          mkdir -p "${GITHUB_WORKSPACE}/toolchain"
          tar xzf clang.tar.gz -C "${GITHUB_WORKSPACE}/toolchain"

      - name: 校验 Clang 工具链
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/toolchain/bin/clang" --version | head -n 1

      - name: CCache 缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ matrix.device }}-${{ github.ref_name }}
          # 加速：优先回退到本机型历史缓存，再回退到其它机型的缓存，
          # 让共享源码（绝大多数目标文件）跨机型复用
          restore-keys: |
            kernel-${{ matrix.device }}-
            kernel-
          max-size: 2G

      - name: 编译内核（${{ matrix.defconfig }}）
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:/usr/lib/ccache:${PATH}"
          # /proc/version（系统里的“详细内核版本”）括号里就是 user@host；
          # host 写成 localhost，让它看起来像手动编译，而不是 CI runner。
          export KBUILD_BUILD_USER="XuexGao"
          export KBUILD_BUILD_HOST="localhost"
          # 编译日期也固定成 UTC，避免暴露 runner 所在时区/机器时间。
          export KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %d %b %Y %H:%M:%S UTC')"

          MAKEFLAGS=(
            O=out
            ARCH=arm64
            # 双保险：版本号里的 '+' 由 Makefile 的 EXTRAVERSION 提供，
            # scripts/setlocalversion 也已不再在未打 tag 的检出上重复追加 '+'。
            LOCALVERSION=
            CC="ccache clang"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "::group::Make defconfig"
          make "${MAKEFLAGS[@]}" "${DEFCONFIG}"
          echo "::endgroup::"

          # 加速：只构建最终需要的 Image.gz-dtb（其依赖已含 vmlinux 与 dtbs），
          # 不跑默认全量目标（本内核无 =m 模块）。
          echo "::group::Make Image.gz-dtb"
          make "${MAKEFLAGS[@]}" -j"$(nproc --all)" Image.gz-dtb 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          echo "::endgroup::"

          echo "::group::CCache 命中统计"
          ccache -s || true
          echo "::endgroup::"

          test -f out/arch/arm64/boot/Image.gz-dtb || { echo "::error::未找到 Image.gz-dtb"; exit 1; }
          ls -lh out/arch/arm64/boot/

      - name: 校验 SukiSU 已编入（CONFIG_KSU=y）
        working-directory: kernel
        run: |
          set -euo pipefail
          if [ -f out/.config ] && grep -q '^CONFIG_KSU=y' out/.config; then
            echo "✅ CONFIG_KSU=y 已确认，SukiSU 内核"
          else
            echo "::error::CONFIG_KSU=y 未设置，未编译进 SukiSU"
            exit 1
          fi

      - name: 收集内核模块（若有 .ko）
        working-directory: kernel
        run: |
          set -euo pipefail
          if find out -name '*.ko' | grep -q .; then
            find out -name '*.ko' -exec cp -v {} AnyKernel3/modules/system/lib/modules/ \;
          else
            echo "无内核模块，跳过（do.modules=0）"
          fi

      - name: 记录构建元信息（内核版本 / SUSFS / SukiSU 版本）
        working-directory: kernel
        run: |
          set -euo pipefail
          KV="$(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile \
                | awk '{print $3}' | paste -sd.)"
          KV_FULL="${KV}$(grep -E '^EXTRAVERSION' Makefile | awk '{print $3}')"
          SUSFS_VERSION="$(sed -n 's/^#define SUSFS_VERSION "\{0,1\}\(v[0-9.]*\)"\{0,1\}/\1/p' include/linux/susfs.h | head -1)"
          [ -n "${SUSFS_VERSION}" ] || SUSFS_VERSION="unknown"
          KSU_REL="$(sed -n 's/^KSU_RELEASE *=\? *\([0-9.]*\).*/\1/p' KernelSU/kernel/Makefile | head -1)"
          [ -n "${KSU_REL}" ] || KSU_REL="${KSU_VERSION}"
          echo "内核版本: ${KV_FULL} | SUSFS: ${SUSFS_VERSION} | SukiSU: ${KSU_REL}"
          {
            echo "KV_FULL=${KV_FULL}"
            echo "SUSFS_VERSION=${SUSFS_VERSION}"
            echo "KSU_RELEASE=${KSU_REL}"
          } > "${GITHUB_WORKSPACE}/${DEVICE}-meta.env"

      - name: 校验 SUSFS 版本（必须为 v2.3.0）
        working-directory: kernel
        run: |
          set -euo pipefail
          DECL="$(sed -n 's/^#define SUSFS_VERSION "\(v[0-9.]*\)"/\1/p' include/linux/susfs.h | head -1)"
          echo "include/linux/susfs.h: SUSFS_VERSION=${DECL}"
          [ "${DECL}" = "v2.3.0" ] || { echo "::error::SUSFS 版本应为 v2.3.0，实际 '${DECL}'"; exit 1; }
          # 2.3.0 起 AS_FLAGS_* 一律存放在 inode->i_mapping->flags；
          # 若仍有 i_state 存取，说明标志约定不一致（读写错位会让隐藏功能静默失效）
          BAD="$(grep -rn 'AS_FLAGS_.*i_state\|i_state.*AS_FLAGS_' fs/ include/linux/susfs*.h 2>/dev/null || true)"
          if [ -n "${BAD}" ]; then
            echo "::error::仍有 AS_FLAGS_* 存在 inode->i_state 上（应为 i_mapping->flags）："
            echo "${BAD}"
            exit 1
          fi
          # 2.3.0 新增的 TIF 标志与辅助函数必须齐全
          for sym in TIF_PROC_NO_SU TIF_PROC_UMOUNTED_FOR_ZYGOTE_NEXT susfs_set_current_proc_no_su susfs_clear_current_proc_umounted; do
            grep -q "${sym}" include/linux/susfs_def.h || { echo "::error::susfs_def.h 缺少 ${sym}"; exit 1; }
          done
          # open_redirect 的读侧用 SRCU；拆除侧必须用 synchronize_srcu 等待 SRCU 读者，
          # 否则 synchronize_rcu() 不覆盖 SRCU 读者，会留下 UAF 窗口（上游 2.3.0 修复）。
          grep -qE 'DEFINE_(STATIC_)?SRCU\(susfs_srcu_open_redirect\)' fs/susfs.c \
            || { echo "::error::open_redirect 缺少 SRCU 定义"; exit 1; }
          grep -q 'synchronize_srcu(&susfs_srcu_open_redirect)' fs/susfs.c \
            || { echo "::error::open_redirect 拆除侧缺少 synchronize_srcu"; exit 1; }
          # 该函数自身持有 SRCU 读锁，返回的字符串必须是拷贝（不能指向链表内节点，
          # 否则解锁后指针可能失效）
          grep -q 'strscpy(\*spoofed_name, entry->info.redirected_pathname' fs/susfs.c \
            || { echo "::error::open_redirect 返回的路径应为拷贝"; exit 1; }
          echo "✅ SUSFS v2.3.0 结构与标志约定校验通过"

      - name: 校验隐藏项（uname / 版本横幅 / config.gz / 日志）
        working-directory: kernel
        run: |
          set -euo pipefail
          FAIL=0
          # 只读构建已经生成好的文件，不再调用 make：这一步跑在
          # `set -e -o pipefail` 下，任何 make 调用（缺 CC=clang 等参数时）都会
          # 让整个步骤在打印任何诊断之前就以非零码退出。

          # 1) 对外版本号（uname -r / os.version）必须是 4.9.337+
          RELEASE="$(cat out/include/config/kernel.release)"
          echo "kernelrelease = ${RELEASE}"
          [ "${RELEASE}" = "4.9.337+" ] || { echo "::error::uname -r 不是 4.9.337+（得到 ${RELEASE}）"; FAIL=1; }
          grep -q 'define UTS_RELEASE "4.9.337+"' out/include/generated/utsrelease.h \
            || { echo "::error::UTS_RELEASE 不对"; FAIL=1; }

          # 2) /proc/version 括号里的 user@host 来自编译期定义
          COMPILE_H=out/include/generated/compile.h
          echo "--- ${COMPILE_H} ---"; cat "${COMPILE_H}"
          grep -q 'define LINUX_COMPILE_BY "XuexGao"' "${COMPILE_H}" \
            || { echo "::error::LINUX_COMPILE_BY 不是 XuexGao"; FAIL=1; }
          grep -q 'define LINUX_COMPILE_HOST "localhost"' "${COMPILE_H}" \
            || { echo "::error::LINUX_COMPILE_HOST 不是 localhost"; FAIL=1; }

          # 3) 产物对象里不允许出现分支名 / fork 标识（日志字符串应已被 no_printk 折叠掉）
          LEAKY="$(grep -rla -E 'lineage-2[0-9.]*-sukisu-susfs|SukiSU-Ultra|sukisu-susfs' \
                     out/drivers/kernelsu out/init/version.o out/kernel/configs.o 2>/dev/null | sort -u | head -10 || true)"
          if [ -n "${LEAKY}" ]; then
            echo "::error::以下产物里仍能搜到构建标识："; echo "${LEAKY}"; FAIL=1
          else
            echo "✅ 产物对象内无分支名 / fork 标识"
          fi
          LOGS="$(strings -a out/drivers/kernelsu/ksu.o | grep -cE 'KernelSU:|allow root for|Crowning manager' || true)"
          echo "ksu.o 内残留的日志格式串数量 = ${LOGS}"
          [ "${LOGS}" = "0" ] || { echo "::error::CONFIG_KSU_QUIET_LOG 没生效，dmesg 仍会暴露标识"; FAIL=1; }

          # 4) /proc/config.gz 的数据源（out/kernel/config_data.gz）必须已去掉标识行，
          #    同时仍是一份完整 config
          test -f out/kernel/config_data.gz || { echo "::error::缺 out/kernel/config_data.gz"; exit 1; }
          HIT="$(gzip -dc out/kernel/config_data.gz | grep -Ec '^[# ]*CONFIG_(KSU|SUSFS|KPM)' || true)"
          TOTAL="$(gzip -dc out/kernel/config_data.gz | grep -Ec '^CONFIG_' || true)"
          RAW="$(grep -Ec '^[# ]*CONFIG_(KSU|SUSFS|KPM)' out/.config || true)"
          echo "config_data.gz: 标识残留=${HIT} / 保留 CONFIG_ 行=${TOTAL}（out/.config 里标识行=${RAW}）"
          [ "${HIT}" = "0" ] || { echo "::error::config.gz 过滤未生效"; FAIL=1; }
          [ "${RAW}" != "0" ] || echo "::warning::out/.config 里本来就没有标识行，过滤无从验证"
          [ "${TOTAL}" -gt 1000 ] || { echo "::error::config.gz 内容异常（行数过少）"; FAIL=1; }

          # 5) 日志静默 / dmesg 限制确实生效
          for c in CONFIG_KSU_QUIET_LOG=y CONFIG_SECURITY_DMESG_RESTRICT=y; do
            grep -q "^${c}$" out/.config || { echo "::error::out/.config 缺少 ${c}"; FAIL=1; }
          done
          if grep -q '^CONFIG_KSU_SUSFS_ENABLE_LOG=y$' out/.config; then
            echo "::error::SUSFS 内核日志仍开着"; FAIL=1
          fi

          # 6) 版本码必须与正式版管理器一致。管理器自己的 versionCode =
          #    4*10000 + 构建时提交数 - 2815（manager/build.gradle.kts），4.2.0
          #    的管理器是在 tag 之后一个提交(3715)上构建的 -> 40900。内核若报
          #    40899（tag 本身的 3714）就会和管理器对不上。
          KSU_COMMITS="$(grep -E '^KSU_GIT_COMMITS[[:space:]]*\?=' KernelSU/kernel/Makefile | grep -oE '[0-9]+' | head -1)"
          KSU_REL_PIN="$(grep -E '^KSU_RELEASE[[:space:]]*\?=' KernelSU/kernel/Makefile | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          KSU_SHA_PIN="$(grep -E '^KSU_GIT_SHA[[:space:]]*\?=' KernelSU/kernel/Makefile | sed 's/.*=[[:space:]]*//')"
          KSU_CODE="$(expr 40000 + "${KSU_COMMITS:-0}" - 2815)"
          echo "钉死值: commits=${KSU_COMMITS} release=${KSU_REL_PIN} sha=${KSU_SHA_PIN} -> KSU_VERSION=${KSU_CODE}"
          [ "${KSU_CODE}" = "40900" ] || { echo "::error::版本码 ${KSU_CODE} 与正式版管理器 40900 不一致"; FAIL=1; }
          [ "${KSU_REL_PIN}" = "4.2.0" ] || { echo "::error::KSU_RELEASE=${KSU_REL_PIN} 不是 4.2.0"; FAIL=1; }

          # 7) 上报给 userspace 的 SukiSU 版本串（Manager 里那一行）
          VERFULL="$(grep -rhoa 'v4\.[0-9]\+\.[0-9]\+-[0-9a-f]\{8\}@main' out/drivers/kernelsu 2>/dev/null | head -1 || true)"
          echo "KSU_VERSION_FULL = ${VERFULL:-未找到}"
          [ -n "${VERFULL}" ] || { echo "::error::没找到钉死的 KSU_VERSION_FULL"; FAIL=1; }

          [ "${FAIL}" = "0" ] || { echo "::error::隐藏性校验未通过，见上面的 ::error 行"; exit 1; }
          echo "✅ 隐藏项校验全部通过"

      - name: 打包 AnyKernel3 刷机包
        working-directory: kernel
        run: |
          set -euo pipefail

          # ---- 清理仓库内遗留产物（boot.img 为示例，一并移除）----
          rm -f AnyKernel3/boot.img AnyKernel3/*.zip

          # ---- 覆盖编译产物 ----
          cp -v out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb

          # ---- 按机型生成 anykernel.sh ----
          # 这行会被写进 Recovery 刷机日志（"Kernel: ..."），所以不带产品/作者标识，
          # 与 /proc/version 保持一致。
          KERNEL_STRING="4.9.337+ (XuexGao@localhost)"
          NL=$'\n'
          DEVICE_LINES=""
          i=1
          for n in $(echo "${DEVICE_NAMES}" | tr '|' ' '); do
            DEVICE_LINES="${DEVICE_LINES}${NL}device.name${i}=${n}"
            i=$((i + 1))
          done
          DO_MODULES=$([ -n "$(ls -A AnyKernel3/modules/system/lib/modules/ | grep -v '^placeholder$' || true)" ] && echo 1 || echo 0)
          echo "do.modules=${DO_MODULES}"

          cat > AnyKernel3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=${KERNEL_STRING}
          do.devicecheck=1
          do.modules=${DO_MODULES}
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0${DEVICE_LINES}
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          EOF
          echo "---- anykernel.sh ----"
          cat AnyKernel3/anykernel.sh

          # ---- 打包 ----
          cd AnyKernel3
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          zip -r9 "${ZIP_PATH}" . -x '*.git*' '*.zip'
          echo "✅ 打包完成: ${ZIP_PATH}"
          unzip -l "${ZIP_PATH}" | tail -n +3 | head -n 25
          ls -lh "${ZIP_PATH}"

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ env.DEVICE }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.DEVICE }}-meta.env
          if-no-files-found: error

      # 可选：编译失败时推送通知（需在仓库 Secrets 添加 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID）
      # - name: 失败通知（Telegram）
      #   if: failure() && env.TELEGRAM_BOT_TOKEN != ''
      #   run: |
      #     curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
      #       -d chat_id="${TELEGRAM_CHAT_ID}" \
      #       -d text="❌ SukiSU 内核编译失败：${DEVICE} (${GITHUB_REF_NAME})%0A详见 https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # ---------------------------------------------------------------------------
  # Job 3: release —— 汇总全部机型 zip，合并为 1 个 Release（通用内核）
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [setup, build-kernel]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      KSU_VERSION: ${{ needs.setup.outputs.ksu_version }}
      BRANCH: ${{ github.ref_name }}
      DEVICES_JSON: ${{ needs.setup.outputs.devices_json }}
      DEVICE_LIST: ${{ needs.setup.outputs.device_list }}
      # 通用内核：标题/标签都不带系统版本号
      # RELEASE_TITLE 由「生成 Release 说明」步骤按源码里的 SUSFS 版本动态拼出
      # （形如 "OPPO Kernel SukiSU + SUSFS 2.3.0"），避免升级 SUSFS 后标题写死过时。
      TAG_NAME: SukiSU_${{ needs.setup.outputs.build_date }}
    steps:
      - name: 检出源码（用于生成 Changes）
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          path: kernel

      - name: 下载各机型产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 生成 Release 说明
        working-directory: kernel
        run: |
          set -euo pipefail

          # ---- 内核版本 / SUSFS（取任一机型 meta）----
          META="$(ls "${GITHUB_WORKSPACE}/dist"/*/*-meta.env 2>/dev/null | head -1)"
          if [ -z "${META}" ]; then
            echo "::error::未找到构建元信息 meta.env"; exit 1
          fi
          KV_FULL="$(grep '^KV_FULL=' "${META}" | cut -d= -f2-)"
          SUSFS_VERSION="$(grep '^SUSFS_VERSION=' "${META}" | cut -d= -f2-)"
          # SukiSU 版本以构建时从源码解析出来的为准
          if KSU_FROM_META="$(grep '^KSU_RELEASE=' "${META}" | cut -d= -f2-)"; then
            [ -n "${KSU_FROM_META}" ] && export KSU_VERSION="${KSU_FROM_META}"
          fi
          echo "KV_FULL=${KV_FULL} | SUSFS_VERSION=${SUSFS_VERSION} | KSU_VERSION=${KSU_VERSION}"

          # ---- Release 标题：SUSFS 版本取自源码，标题不写死 ----
          # 形如 "OPPO Kernel SukiSU + SUSFS 2.3.0"（去掉 v 前缀，不加括号）
          SUSFS_NUM="${SUSFS_VERSION#v}"
          RELEASE_TITLE="OPPO Kernel SukiSU + SUSFS ${SUSFS_NUM}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}"
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> "$GITHUB_ENV"

          # ---- Changes（最近提交，提交标题 (短哈希)）----
          git log -10 --pretty=format:'%s (%h)' > "${GITHUB_WORKSPACE}/changes.txt"

          # ---- 汇总生成正文 ----
          export KV_FULL SUSFS_VERSION
          export BUILD_DATE KSU_VERSION BRANCH DEVICES_JSON DEVICE_LIST OS_SUPPORT ANDROID_SUPPORT
          python3 - <<'PY'
          import json, os

          # 管理器下载指向 SukiSU-Ultra 官方 build-manager 工作流的产物页，
          # 不再用频道里的单条消息链接（那条会随版本失效）。
          MANAGER_URL = "https://github.com/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml"

          def env(k):
              return os.environ.get(k, "")

          devices = json.loads(env("DEVICES_JSON"))
          date = env("BUILD_DATE")
          ksu = env("KSU_VERSION"); susfs = env("SUSFS_VERSION")
          br = env("BRANCH"); kv = env("KV_FULL")
          os_support = env("OS_SUPPORT"); android = env("ANDROID_SUPPORT")
          changes = open(os.path.join(env("GITHUB_WORKSPACE"), "changes.txt")).read()

          device_names = " / ".join(d["label"] for d in devices)

          lines = []
          lines.append("> **通用内核**：同一个包通刷 **LineageOS 21 / 22.0 / 22.1**（Android 14 / 15），")
          lines.append("> 只需按机型下载，不必按系统版本区分。")
          lines.append("")
          lines.append("### 下载选择")
          lines.append("")
          lines.append("| 内核 | 特性 | 适用场景 | 管理器下载 |")
          lines.append("|---|---|---|---|")
          lines.append(f"| **SukiSU-Ultra + SUSFS** | SukiSU v{ksu} + SUSFS {susfs} | 需要 SUSFS 隐藏功能、sus mount、sus path 等 | [SukiSU-Ultra Manager]({MANAGER_URL}) |")
          lines.append("")
          lines.append("提供格式：")
          lines.append("")
          lines.append("- **.zip** — AnyKernel3 刷入包，通过 recovery (TWRP) 刷入")
          lines.append("")
          lines.append("### 本次构建")
          lines.append("")
          lines.append("| 机型 | 下载 | 平台 | 内核版本 |")
          lines.append("|---|---|---|---|")
          for d in devices:
              lines.append(f"| OPPO {d['label']} | `SukiSU_{d['device']}_{date}.zip` | {d['soc']} / {d['snapdragon']} | {kv} |")
          lines.append("")
          lines.append("### 共同信息")
          lines.append("")
          lines.append(f"- **设备**: OPPO {device_names}")
          lines.append(f"- **系统**: {os_support} (Android {android})，无需按版本区分")
          lines.append(f"- **内核版本**: {kv} (Non-GKI)")
          lines.append("- **编译器**: ZyCromerZ Clang 13.0.1 + GCC (aarch64/arm)")
          lines.append(f"- **分支**: {br}")
          lines.append("")
          lines.append(f"### SukiSU-Ultra (含 SUSFS {susfs})")
          lines.append("")
          lines.append(f"- SukiSU-Ultra v{ksu}")
          lines.append(f"- SUSFS {susfs}")
          lines.append(f"- 管理器下载: [{MANAGER_URL}]({MANAGER_URL})")
          lines.append("")
          lines.append("### 刷入方法")
          lines.append("")
          lines.append("#### 通过 Recovery (TWRP)")
          lines.append("")
          lines.append("1. 下载对应机型的 `SukiSU_*.zip`")
          lines.append("2. 下载并安装 SukiSU-Ultra Manager APK")
          lines.append("3. 重启到 recovery (TWRP)")
          lines.append("4. 刷入对应机型的 zip")
          lines.append("5. 重启")
          lines.append("6. 打开 Manager 验证驱动检测")
          lines.append("")
          lines.append("### Changes")
          lines.append("")
          lines.append(changes)
          lines.append("")
          lines.append("> 基于 [XuexGao/android_kernel_oppo_msm8937](https://github.com/XuexGao/android_kernel_oppo_msm8937) 自动构建")

          with open(os.path.join(env("GITHUB_WORKSPACE"), "release-body.md"), "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

          echo "---- release-body.md ----"
          cat "${GITHUB_WORKSPACE}/release-body.md"

      - name: 发布到 GitHub Releases（合并全部机型 zip）
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          bodyFile: release-body.md
          artifacts: dist/*/*.zip
          allowUpdates: true        # 同日重复构建时更新已有 Release
          removeArtifacts: true     # 替换同名资产
          token: ${{ secrets.GITHUB_TOKEN }}
