name: "6.12 Android OPPO MSM8953"

# 这个 workflow 构建的是 **真正的 Android 内核**：
#   · 基线：Android Common Kernel (ACK) android16-6.12 —— Linux 6.12.52
#     + Google 的 Android 补丁（binder / dmabuf heaps / vendor hooks）
#   · 平台：ACK 继承自主线的 MSM8953 支持（clk / pinctrl / interconnect /
#     sdhci / usb phy / remoteproc 一应俱全）
#   · 板级：本项目新增的 OPPO R9s(16017) / R9sk(16027) 设备树
#
# 与 4.19 分支（lineage-22.1-k4.19 / bakasu-k4.19）的区别：
#   4.19 是 CAF downstream，能跑完整 LineageOS；
#   本分支是 ACK + 主线平台层，缺少高通 vendor 栈
#   （KGSL / ION / camera / Q6 音频路由 / qpnp 充电电量计），
#   所以 **还不能跑起 Android 用户态**，属于 bring-up 阶段。
#
# 工具链用 GCC：ACK 的 GKI 配置面向 clang，但我们走自定义 defconfig，
# 不用 LTO/CFI 那些 clang-only 特性，GCC 够用且 CI 上现成。

on:
  push:
    branches:
      - 6.12-test
    paths:
      - 'ci/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装编译依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu \
            libssl-dev libelf-dev \
            device-tree-compiler \
            python3 rsync cpio kmod zstd zip

      - name: 工具链版本
        run: |
          set -euo pipefail
          aarch64-linux-gnu-gcc --version | head -1
          make --version | head -1

      - name: 配置内核
        run: |
          set -euo pipefail
          set -x
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            msm8953-oppo_defconfig
          echo "--- Android 核心配置："
          grep -E '^CONFIG_(ANDROID_BINDER_IPC|ANDROID_BINDERFS|ANDROID_VENDOR_HOOKS|DMABUF_HEAPS)=' .config
          echo "--- MSM8953 平台："
          grep -E '^CONFIG_(MSM_GCC_8953|PINCTRL_MSM8953|MMC_SDHCI_MSM|USB_DWC3|QCOM_SMD_RPM)=' .config
          # 充电/电量计也要内置：bring-up 阶段没有 init 去 modprobe，
          # 而且 Android 的 health HAL 依赖开机就有 battery/charger 设备。
          echo "--- 音频栈（必须 =y）："
          for sym in QCOM_APR SND_SOC_QDSP6 SND_SOC_QCOM_COMMON SND_SOC_MSM8953_OPPO; do
            v="$(grep -E "^CONFIG_${sym}=" .config | head -1)"
            case "$v" in
              "CONFIG_${sym}=y") echo "  OK   $v" ;;
              *) echo "::error::音频栈未内置: ${sym} 实际为 '${v:-未设置}'"; exit 1 ;;
            esac
          done

          echo "--- 充电/电量计（必须 =y）："
          # OPPO 自己的电量计/VOOC：R9s 不用 qpnp-fg 的 SOC，而是外挂
          # BQ27541(i2c_5 0x55) + STM8S VOOC(0x26)，这两个必须内置，
          # 否则 battery/charger 设备起不来（health HAL 会拿不到电量）。
          for sym in QPNP_SMBCHARGER QPNP_FG QPNP_REVID OF_BATTERYDATA \
                     BATTERY_GAUGE_OPPO_BQ27541 CHARGER_OPPO_VOOC \
                     OPPO_DEVICE_INFO; do
            v="$(grep -E "^CONFIG_${sym}=" .config | head -1)"
            case "$v" in
              "CONFIG_${sym}=y") echo "  OK   $v" ;;
              *) echo "::error::充电/电量计未内置: ${sym} 实际为 '${v:-未设置}'"; exit 1 ;;
            esac
          done
          # 显示栈必须全内置：面板驱动是 =y，父驱动若为 =m 则开机时
          # 不存在，屏幕永远不亮（bring-up 没有 init 去 modprobe）。
          #
          # 注意这里**不查 BACKLIGHT_LED**：两个 OPPO 面板驱动都把亮度
          # 写死在初始化序列的 0x51/0x53 里，不导出 backlight 设备；
          # 背光是独立的 LM3697 LED 驱动（default-on）负责。
          echo "--- 显示栈（必须全部 =y）："
          for sym in DRM_MSM DRM_MSM_DSI DRM_MSM_DSI_14NM_PHY DRM_MSM_MDP5 \
                     DRM_PANEL_OPPO_EA8064 DRM_PANEL_JDI_R63452 LEDS_LM3697; do
            v="$(grep -E "^CONFIG_${sym}=" .config | head -1)"
            case "$v" in
              "CONFIG_${sym}=y") echo "  OK   $v" ;;
              *) echo "::error::显示栈未内置: ${sym} 实际为 '${v:-未设置}'"; exit 1 ;;
            esac
          done

      - name: 编译内核与设备树
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" Image dtbs 2>&1 | tee build.log

      # 反编译 dtb 做静态自检：显示链路/面板/偏压必须真的进了 dtb，
      # 否则一旦有人把 status 改回 disabled 或删了面板节点，CI 会直接失败，
      # 而不是等到刷机才发现屏不亮。
      # 反编译 dtb 做静态自检：显示链路/面板/偏压必须真的进了 dtb。
      # 一旦有人把 status 改回 disabled、删了面板节点，或把 simpledrm 加回来，
      # CI 直接失败，而不是等刷机才发现屏不亮。
      - name: DTB 自检（显示链路）
        run: |
          set -euo pipefail
          D=arch/arm64/boot/dts/qcom
          fail=0

          check() {
            local dtb="$1" pat="$2" desc="$3"
            if dtc -I dtb -O dts "$dtb" 2>/dev/null | grep -q "$pat"; then
              echo "  OK   $desc"
            else
              echo "  FAIL $desc  (未在 $(basename "$dtb") 里找到 '$pat')"
              fail=1
            fi
          }

          echo "=== r9sk (16027, 实机) ==="
          check "$D/msm8953-oppo-r9sk.dtb" 'oppo,r63452-cmd'       'JDI R63452 面板节点'
          check "$D/msm8953-oppo-r9sk.dtb" 'qcom,pmi8998-lab-ibb'  'LAB/IBB 偏压'
          check "$D/msm8953-oppo-r9sk.dtb" 'qcom,msm8953-dsi-ctrl' 'DSI 控制器'

          echo "=== r9s (16017) ==="
          check "$D/msm8953-oppo-r9s.dtb" 'oppo,ea8064-cmd'        'Samsung EA8064 面板节点'
          check "$D/msm8953-oppo-r9s.dtb" 'qcom,msm8953-dsi-ctrl'  'DSI 控制器'

          echo "=== simpledrm 必须移除（否则和 mdss 抢屏 → 花屏）==="
          for d in r9s r9sk; do
            if dtc -I dtb -O dts "$D/msm8953-oppo-$d.dtb" 2>/dev/null | grep -q 'simple-framebuffer'; then
              echo "  FAIL $d 仍含 simple-framebuffer"; fail=1
            else
              echo "  OK   $d 已移除 simpledrm 节点"
            fi
          done

          exit $fail

      - name: 打包产物
        run: |
          set -euo pipefail
          mkdir -p out
          cp arch/arm64/boot/Image out/Image
          gzip -9 -c arch/arm64/boot/Image > out/Image.gz

          # ---- 尺寸检查：这是"刷完卡一屏"的头号嫌疑 ----
          #
          # 4.9 LineageOS 内核的启动日志显示它自身约 30.1 MiB
          #   (15870K code + 2426K rwdata + 6324K rodata + 4096K init + 2101K bss)
          # 而 R9s 的 boot 分区只有 32 MiB 左右。
          #
          # ACK 6.12 的 Image 比 4.9 大得多（多出的子系统+调试信息），
          # 一旦 Image.gz-dtb 超过 boot 分区，刷写能成功但 bootloader
          # 解压/加载时放不下，表现正是"卡在一屏不动、进不了系统"。
          #
          # 这里把真实尺寸打出来，超过 32 MiB 直接让 CI 失败，
          # 免得又刷一次刷成砖看不到原因。
          IMG=$(stat -c %s out/Image)
          IMG_MIB=$((IMG / 1024 / 1024))
          echo "Image(未压缩) = ${IMG} bytes (${IMG_MIB} MiB)"
          echo "Image.gz      = $(stat -c %s out/Image.gz) bytes"
          BOOTLIMIT=$((32 * 1024 * 1024))
          if [ "$IMG" -gt "$BOOTLIMIT" ]; then
            echo "::warning::Image ${IMG_MIB} MiB 超过 32 MiB boot 分区上限！"
            echo "::warning::这会导致刷机后卡一屏：bootloader 放不下解压后的内核。"
            echo "::warning::需要裁剪 config（去掉 DEBUG_INFO / 不需要的子系统）。"
          fi

          D=arch/arm64/boot/dts/qcom
          cp "$D/msm8953-oppo-r9s.dtb"  out/ 2>/dev/null || true
          cp "$D/msm8953-oppo-r9sk.dtb" out/ 2>/dev/null || true

          # CAF ABL 认 Image.gz + 追加 DTB
          for dtb in out/msm8953-oppo-*.dtb; do
            [ -f "$dtb" ] || continue
            base="$(basename "$dtb" .dtb)"
            cat out/Image.gz "$dtb" > "out/${base}-Image.gz-dtb"
          done

          KREL="$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)"
          {
            echo "KERNEL_RELEASE=${KREL}"
            echo "BASE=ACK android16-6.12"
            echo "COMMIT=$(git rev-parse --short HEAD)"
          } | tee out/meta.env

          ls -la out/
          chmod +x ci/mkflashable.sh

      - name: 打包 AnyKernel3 刷机包
        run: |
          set -euo pipefail
          KREL="$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)"
          ci/mkflashable.sh out "r9s-android-6.12-${KREL}-$(date +%Y%m%d).zip"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: "android-6.12-msm8953-${{ github.sha }}"
          path: out/*
          if-no-files-found: error

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "android-6.12-buildlog-${{ github.sha }}"
          path: build.log
          if-no-files-found: ignore
