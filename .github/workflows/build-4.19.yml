# ==============================================================================
# lineage-22.1-k4.19 实验分支 CI — OPPO MSM8937/MSM8953 系列
# ------------------------------------------------------------------------------
# 分支定位：把 4.9 的 OPPO 移植内核升级到 4.19。
#   4.19 基线：https://github.com/imren0x/msm-4.19 @ mi8953/latest
#              （= LineageOS sdm660 lineage-20 + CIP 4.19.325-cip136 的统一
#                MSM8953/8937/450 内核，已内置 drivers/kernelsu）
#   注：基线里已经带有 drivers/kernelsu（KSU_VERSION=32567）与完整 MSM8953
#       SoC 支持，所以本分支的工作重点是「把 OPPO 机型支持重新移植上来」，
#       而不是从零引入 root 方案。
#
# 本工作流只做两件事：
#   1. base —— 冒烟构建 4.19 基线本身（vendor/msm8953-perf_defconfig），
#      验证工具链 / 基线可用，作为 OPPO 移植的对照基准
#   2. 机型构建 —— 按矩阵编译各 OPPO 机型，AnyKernel3 打包成 zip
#
# 说明：Release 默认关闭，实验分支先把「能编出来」跑通。
# ==============================================================================

name: Build 4.19 Kernel

on:
  # workflow_dispatch 需要工作流文件位于**默认分支**才会被 GitHub 索引；
  # 本分支不是默认分支，所以同时提供 push 触发（改 ci/targets 即触发一次构建），
  # 这样无需改动默认分支就能手动控制构建。
  workflow_dispatch:
    inputs:
      build_ref:
        description: '要构建的分支（4.19 系列）：lineage-22.1-k4.19（纯净） / bakasu-k4.19（BakaSU）'
        required: false
        type: choice
        default: lineage-22.1-k4.19
        options:
          - lineage-22.1-k4.19
          - bakasu-k4.19
      r9s:
        description: 'R9s'
        required: false
        type: boolean
        default: true
      a57:
        description: 'A57'
        required: false
        type: boolean
        default: true
      publish_release:
        description: '是否发布到 GitHub Releases'
        required: false
        type: boolean
        default: true
  push:
    branches:
      - lineage-22.1-k4.19
      - bakasu-k4.19
    paths:
      - 'ci/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CLANG_URL: https://github.com/ZyCromerZ/Clang/releases/download/13.0.1-20230207-release/Clang-13.0.1-20230207.tar.gz

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: setup —— 生成构建矩阵
  # ---------------------------------------------------------------------------
  setup:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      targets_json: ${{ steps.gen.outputs.targets_json }}
      target_list: ${{ steps.gen.outputs.target_list }}
      build_date: ${{ steps.gen.outputs.BUILD_DATE }}
      publish: ${{ steps.gen.outputs.publish }}
    steps:
      # push 事件要从仓库里的 ci/targets 决定构建目标，所以 setup 必须 checkout。
      # 只拉最近一次提交即可，不需要完整历史。
      - name: 检出（用于读取 ci/targets）
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref_name }}
          fetch-depth: 1

      - name: Generate matrix
        id: gen
        env:
          # workflow 文件在默认分支上，从默认分支页触发时 GITHUB_REF_NAME
          # 是默认分支名而不是目标分支，所以分支判断必须用 inputs.build_ref。
          BUILD_REF: ${{ inputs.build_ref || github.ref_name }}
        run: |
          set -euo pipefail

          BUILD_DATE="$(date +'%Y%m%d')"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

          # ---- 目标矩阵 ----
          # defconfig  : 主 defconfig（相对 arch/arm64/configs/）
          # fragments  : 追加的 config 片段，空格分隔（用 merge_config.sh 合并）
          # allow_fail : true 表示该目标失败不阻断整体（移植期用于冒烟）
          # push 事件没有 inputs：改从仓库里的 ci/targets 读取要构建的目标，
          # 这样不碰默认分支也能手动控制跑哪些机型（改一行文件即触发）。
          # 文件不存在或为空时回退到 base 冒烟。
          # 机型打勾 -> 目标名（bakasu 分支的产物名带 -bakasu 后缀）
          WANT=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f ci/targets ]; then
            WANT="$(grep -vE '^\s*(#|$)' ci/targets | tr '\n' ',' | sed 's/,$//')"
            echo "从 ci/targets 读到目标: '${WANT}'"
          fi
          if [ -z "${WANT}" ]; then
            if [ "${{ inputs.r9s }}" = "true" ]; then
              case "${BUILD_REF}" in
                bakasu-k4.19) WANT="R9s-bakasu" ;;
                *)            WANT="R9s" ;;
              esac
            fi
            if [ "${{ inputs.a57 }}" = "true" ]; then
              case "${BUILD_REF}" in
                bakasu-k4.19) WANT="${WANT:+${WANT},}A57-bakasu" ;;
                *)            WANT="${WANT:+${WANT},}A57" ;;
              esac
            fi
          fi
          [ -n "${WANT}" ] || WANT="base"
          python3 - "${WANT}" <<'PYEOF' > matrix.json
          import json, os, sys, subprocess

          # 注意：mi8953.config 是**必需**片段，不是可选的小米附加功能。
          # drivers/power/supply/qcom/qpnp-fg.c:8033 在没有
          # IS_ENABLED(CONFIG_MACH_XIAOMI_MSM8953) 保护的情况下直接调用
          # xiaomi_msm8953_mach_get() / XIAOMI_MSM8953_MACH_*，所以
          # 不合并 mi8953.config（即 CONFIG_MACH_XIAOMI_MSM8953=y）时基线
          # 自身就编不过（-Werror=implicit-function-declaration）。
          # 本仓库面向 OPPO，不启用任何 Xiaomi 机型，但该符号仍必须为 y，
          # 让 qpnp-fg 走 xiaomi_msm8953_mach_get() 返回 UNKNOWN 的分支。
          BASE_FRAGMENTS = "vendor/mi8953.config"
          COMMON = "vendor/oppo-common.config"
          R9S = "vendor/oppo-r9s.config"
          # 纯净版：显式关掉 KernelSU（config KSU 是 default y，
          # 不关的话编出来一定自带 BakaSU）。
          NOKSU = "vendor/oppo-no-ksu.config"
          # BPF + 容器（droidspaces）支持：完整 namespace 全集、
          # cgroup 控制器、BPF 显式重申。详见该 fragment 头部注释。
          BPFC = "vendor/oppo-bpf-containers.config"
          # OPPO A57 (16061 / MSM8940) 机型片段
          A57 = "vendor/oppo-a57.config"
          # BakaSU + SUSFS 片段（bakasu-k4.19 专用）
          BAKASU = "vendor/oppo-bakasu-susfs.config"
          # 每个分支只构建自己的产物：lineage-22.1-k4.19 出纯净内核，
          # bakasu-k4.19 出 BakaSU + SUSFS。靠下面的 branch 字段过滤，
          # ci/targets 只是在**本分支的目标里**再选子集（可留空）。
          BRANCH = os.environ.get("BUILD_REF", "")
          targets = [
            {
              "target": "base", "label": "4.19 base smoke",
              "branch": "lineage-22.1-k4.19",
              "defconfig": "vendor/msm8953-perf_defconfig",
              "fragments": BASE_FRAGMENTS,
              "device_names": "", "soc": "MSM8953", "snapdragon": "Snapdragon 625",
              "allow_fail": False,
            },
            {
              # 纯净内核（无 root）。config 里 KSU 是 default y，
              # 不显式关掉的话编出来一定自带 KernelSU。
              "target": "R9s", "label": "R9s (clean, no root)",
              "branch": "lineage-22.1-k4.19",
              "defconfig": "vendor/msm8953-perf_defconfig",
              "fragments": BASE_FRAGMENTS + " " + COMMON + " " + R9S + " " + NOKSU + " " + BPFC,
              "device_names": "r9s|R9s|16017|16027|msm8953",
              "soc": "MSM8953", "snapdragon": "Snapdragon 625",
              "allow_fail": True,
            },
            {
              # A57 (MSM8940 / 16061) 独立构建。
              # 为什么不能和 R9s 合进同一个内核：两者触摸屏驱动
              # （Goodix GT5688 vs Synaptics S3320）各自导出同名全局符号
              # （is_gesture_enable_for_lcd / lcd_wakeup_finger_protect /
              #   touchkey_enabled），同时在编会 multiple definition。
              # 4.9 分支本来也是 A57/R9s 两份 defconfig 分开编译的。
              "target": "A57", "label": "A57 (clean, no root)",
              "branch": "lineage-22.1-k4.19",
              "defconfig": "vendor/msm8953-perf_defconfig",
              "fragments": BASE_FRAGMENTS + " " + COMMON + " " + A57 + " " + NOKSU + " " + BPFC,
              "device_names": "a57|A57|16061|msm8940|msm8937",
              "soc": "MSM8940", "snapdragon": "Snapdragon 435",
              "allow_fail": True,
            },
            {
              "target": "R9s-bakasu", "label": "R9s (BakaSU + SUSFS)",
              "branch": "bakasu-k4.19",
              "defconfig": "vendor/msm8953-perf_defconfig",
              "fragments": BASE_FRAGMENTS + " " + COMMON + " " + R9S + " " + BPFC + " " + BAKASU,
              "device_names": "r9s|R9s|16017|16027|msm8953",
              "soc": "MSM8953", "snapdragon": "Snapdragon 625",
              "allow_fail": True,
            },
            {
              "target": "A57-bakasu", "label": "A57 (BakaSU + SUSFS)",
              "branch": "bakasu-k4.19",
              "defconfig": "vendor/msm8953-perf_defconfig",
              "fragments": BASE_FRAGMENTS + " " + COMMON + " " + A57 + " " + BPFC + " " + BAKASU,
              "device_names": "a57|A57|16061|msm8940|msm8937",
              "soc": "MSM8940", "snapdragon": "Snapdragon 435",
              "allow_fail": True,
            },
          ]

          # 先按分支过滤：一个分支只出自己的产物
          on_branch = [t for t in targets if t.get("branch", "any") in ("any", BRANCH)]
          if not on_branch:
              # 分支上没有匹配目标时回退到全部，避免空矩阵让 job 直接失败
              print("# 分支 %s 无目标，回退到全部" % BRANCH, file=sys.stderr)
              on_branch = list(targets)

          # ci/targets 再选子集；若指定的目标不属于本分支（比如在 bakasu
          # 上写了 "R9s"），忽略它并构建本分支全部目标，避免静默出错。
          want = [s.strip() for s in (sys.argv[1] if len(sys.argv) > 1 else "").split(",") if s.strip()]
          if want:
              picked = [t for t in on_branch if t["target"] in want]
              if picked:
                  on_branch = picked
              else:
                  print("# ci/targets=%r 在本分支 %s 上没有匹配目标，改为构建全部：%s"
                        % (",".join(want), BRANCH, ", ".join(t["target"] for t in on_branch)),
                        file=sys.stderr)

          print(json.dumps({"include": on_branch}))
          PYEOF

          MATRIX="$(cat matrix.json)"
          INCLUDED="$(python3 -c 'import json;print(json.dumps(json.load(open("matrix.json"))["include"]))')"
          LIST="$(python3 -c 'import json;print(" ".join(x["target"] for x in json.load(open("matrix.json"))["include"]))')"

          echo "::group::Build matrix"
          echo "${MATRIX}"
          echo "::endgroup::"
          echo "matrix=${MATRIX}"           >> "$GITHUB_OUTPUT"
          echo "targets_json=${INCLUDED}"   >> "$GITHUB_OUTPUT"
          echo "target_list=${LIST}"        >> "$GITHUB_OUTPUT"
          echo "publish=${{ inputs.publish_release && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"

          echo "targets=${LIST}"

  # ---------------------------------------------------------------------------
  # Job 2: build —— 按矩阵编译 + AK3 打包
  # ---------------------------------------------------------------------------
  build-kernel:
    name: "${{ matrix.label }}"
    needs: setup
    runs-on: ubuntu-22.04
    continue-on-error: ${{ matrix.allow_fail }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      DEFCONFIG: ${{ matrix.defconfig }}
      FRAGMENTS: ${{ matrix.fragments }}
      DEVICE_NAMES: ${{ matrix.device_names }}
      SOC: ${{ matrix.soc }}
      SNAPDRAGON: ${{ matrix.snapdragon }}
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: '1'
      CCACHE_SLOPPINESS: time_macros
    steps:
      - name: 设置 10G swap（内核编译内存保障）
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 检出源码
        uses: actions/checkout@v4
        with:
          # 实际编译哪个分支由 build_ref 决定（workflow 文件本身在默认分支）
          ref: ${{ inputs.build_ref || github.ref_name }}
          path: kernel

      - name: 安装编译依赖
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/*.list
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::ftp::Timeout=30"
          PKGS="build-essential bc bison flex \
            libssl-dev libncurses-dev libfl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            cpio lz4 lzop zstd zip unzip \
            device-tree-compiler ccache python3 \
            pngcrush schedtool liblz4-tool libxml2-utils xsltproc squashfs-tools"
          if sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${APT_OPTS} ${PKGS}; then
            echo "✅ 依赖已安装（跳过 apt-get update）"
          else
            echo "⚠️ 直接安装失败，更新索引后重试"
            for i in 1 2 3; do
              sudo apt-get update ${APT_OPTS} && break
              echo "⚠️ apt-get update 第 ${i} 次失败"; sleep 5
            done
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ${APT_OPTS} ${PKGS}
          fi

      - name: 缓存 Clang 13 工具链
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain
          key: clang-13.0.1-20230207-${{ runner.os }}-${{ runner.arch }}

      - name: 下载 Clang 13 工具链
        if: steps.clang-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          wget -q "${CLANG_URL}" -O clang.tar.gz
          mkdir -p "${GITHUB_WORKSPACE}/toolchain"
          tar xzf clang.tar.gz -C "${GITHUB_WORKSPACE}/toolchain"

      - name: 校验 Clang 工具链
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/toolchain/bin/clang" --version | head -n 1

      - name: CCache 缓存
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel419-${{ matrix.target }}
          restore-keys: |
            kernel419-${{ matrix.target }}-
            kernel419-
          max-size: 2G

      - name: 编译内核（${{ matrix.defconfig }}）
        working-directory: kernel
        run: |
          set -euo pipefail
          export PATH="${GITHUB_WORKSPACE}/toolchain/bin:/usr/lib/ccache:${PATH}"
          export KBUILD_BUILD_USER="XuexGao"
          export KBUILD_BUILD_HOST="localhost"
          export KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %d %b %Y %H:%M:%S UTC')"

          MAKEFLAGS=(
            O=out
            ARCH=arm64
            LOCALVERSION=
            CC="ccache clang"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
          )

          echo "::group::Make defconfig + config fragments"
          # 一次性把主 defconfig 与所有片段交给 make。
          # 为什么不自己调 scripts/kconfig/merge_config.sh：
          #   merge_config.sh 的 OUTPUT 默认是 '.'，写入的是**当前目录**的
          #   .config。在 O=out 之外再手工调用它，会在源码树里留下
          #   kernel/.config；随后 prepare3 检测到 $(srctree)/.config 存在，
          #   直接报 ".. is not clean, please run 'make mrproper'" 并失败。
          # 而 make 自带的 %.config 规则会把 merge 结果写到 $(KCONFIG_CONFIG)
          # （O= 时即 out/.config），源码树保持干净。
          # -j1 + 按顺序列出，保证 defconfig 先于片段生效。
          CONFIGS=("${DEFCONFIG}")
          for frag in ${FRAGMENTS}; do
            if [ ! -f "arch/arm64/configs/${frag}" ]; then
              echo "::error::config 片段不存在: arch/arm64/configs/${frag}"
              exit 1
            fi
            CONFIGS+=("${frag}")
          done
          echo "configs: ${CONFIGS[*]}"
          make "${MAKEFLAGS[@]}" -j1 "${CONFIGS[@]}"
          echo "::endgroup::"

          # 断言源码树没有被 config 步骤污染（否则 prepare3 必失败）
          if [ -e .config ] || [ -d include/config ]; then
            echo "::error::源码树被污染：.config 或 include/config 出现在 srctree"
            ls -la .config include/config 2>/dev/null || true
            exit 1
          fi

          echo "::group::Make Image.gz-dtb"
          make "${MAKEFLAGS[@]}" -j"$(nproc --all)" Image.gz-dtb 2>&1 | tee "${GITHUB_WORKSPACE}/build.log"
          echo "::endgroup::"

          echo "::group::CCache 统计"
          ccache -s || true
          echo "::endgroup::"

          test -f out/arch/arm64/boot/Image.gz-dtb || { echo "::error::未找到 Image.gz-dtb"; exit 1; }
          ls -lh out/arch/arm64/boot/

      - name: 记录构建元信息
        working-directory: kernel
        run: |
          set -euo pipefail
          KV="$(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' Makefile | awk '{print $3}' | paste -sd.)"
          KV_FULL="${KV}$(grep -E '^EXTRAVERSION' Makefile | awk '{print $3}')"
          RELEASE="$(cat out/include/config/kernel.release 2>/dev/null || echo unknown)"
          # 纯净分支（lineage-22.1-k4.19）没有 KernelSU/ 与 susfs.h。
          # 这里的 grep/sed 必须容忍文件不存在：本步骤是 set -euo pipefail，
          # grep 找不到文件会返回非零，pipefail 把它当整条管道失败，
          # 赋值失败后 set -e 直接退出（实测 exit code 2，编译本身是成功的）。
          SUSFS_VERSION="$(sed -n 's/^#define SUSFS_VERSION "\{0,1\}\(v[0-9.]*\)"\{0,1\}/\1/p' include/linux/susfs.h 2>/dev/null | head -1 || true)"
          [ -n "${SUSFS_VERSION}" ] || SUSFS_VERSION="unknown"
          KSU_VERSION=""
          if [ -f KernelSU/kernel/Kbuild ]; then
            KSU_VERSION="$(grep -E '^KSU_VERSION[[:space:]]*:=' KernelSU/kernel/Kbuild 2>/dev/null | grep -oE '[0-9]+' | head -1 || true)"
          fi
          [ -n "${KSU_VERSION}" ] || KSU_VERSION="unknown"
          echo "内核版本: ${KV_FULL} (release=${RELEASE}) | SUSFS: ${SUSFS_VERSION} | BakaSU: ${KSU_VERSION}"
          {
            echo "KV_FULL=${KV_FULL}"
            echo "KERNEL_RELEASE=${RELEASE}"
            echo "SUSFS_VERSION=${SUSFS_VERSION}"
            echo "KSU_VERSION=${KSU_VERSION}"
            echo "TARGET=${TARGET}"
            echo "SOC=${SOC}"
            echo "SNAPDRAGON=${SNAPDRAGON}"
            echo "DEVICE_NAMES=${DEVICE_NAMES}"
          } > "${GITHUB_WORKSPACE}/${TARGET}-meta.env"

      - name: 打包 AnyKernel3 刷机包
        if: matrix.device_names != ''
        working-directory: kernel
        run: |
          set -euo pipefail
          ZIP_NAME="v419_${TARGET}_${BUILD_DATE}.zip"

          rm -f AnyKernel3/boot.img AnyKernel3/*.zip
          cp -v out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb

          KV_FULL="$(cat out/include/config/kernel.release)"
          KERNEL_STRING="${KV_FULL} (XuexGao@localhost)"
          NL=$'\n'
          DEVICE_LINES=""
          i=1
          for n in $(echo "${DEVICE_NAMES}" | tr '|' ' '); do
            DEVICE_LINES="${DEVICE_LINES}${NL}device.name${i}=${n}"
            i=$((i + 1))
          done
          DO_MODULES=$([ -n "$(ls -A AnyKernel3/modules/system/lib/modules/ 2>/dev/null | grep -v '^placeholder$' || true)" ] && echo 1 || echo 0)

          cat > AnyKernel3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=${KERNEL_STRING}
          do.devicecheck=1
          do.modules=${DO_MODULES}
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0${DEVICE_LINES}
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot files attributes
          boot_attributes() {
          set_perm_recursive 0 0 755 644 \$RAMDISK/*;
          set_perm_recursive 0 0 750 750 \$RAMDISK/init* \$RAMDISK/sbin;
          } # end attributes

          # boot shell variables
          BLOCK=auto;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          NO_MAGISK_CHECK=1;

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh;

          # boot install
          split_boot;

          flash_boot;
          ## end boot install
          EOF

          cd AnyKernel3
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          zip -r9 "${ZIP_PATH}" . -x '*.git*' '*.zip'
          echo "✅ 打包完成: ${ZIP_PATH}"
          ls -lh "${ZIP_PATH}"

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.target }}
          path: |
            ${{ env.TARGET }}-meta.env
            v419_*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: 失败时上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.target }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: release —— 可选，汇总各机型产物
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [setup, build-kernel]
    if: needs.setup.outputs.publish == 'true' && !cancelled()
    runs-on: ubuntu-latest
    env:
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      TARGETS_JSON: ${{ needs.setup.outputs.targets_json }}
      BRANCH: ${{ inputs.build_ref || github.ref_name }}
      OS_SUPPORT: 'LineageOS 22.1'
      ANDROID_SUPPORT: '15'
      # 日期式标题：与 4.9 工作流保持一致的风格。
      # ⚠️ tag 前缀必须与 4.9 的 BakaSU_<date> 区分开：4.9 的 release-action 开了
      #    allowUpdates + removeArtifacts，若这里也用同日期的 BakaSU_<date>，
      #    会把 4.9 的 Release 连同其产物一起覆盖掉。故 4.19 用 BakaSU419_ 前缀。
      RELEASE_TITLE: >-
        ${{ (inputs.build_ref || github.ref_name) == 'bakasu-k4.19'
            && format('4.19 Kernel BakaSU {0}', needs.setup.outputs.build_date)
            || format('4.19 Kernel {0}', needs.setup.outputs.build_date) }}
      TAG_NAME: >-
        ${{ (inputs.build_ref || github.ref_name) == 'bakasu-k4.19'
            && format('BakaSU419_{0}', needs.setup.outputs.build_date)
            || format('Clean419_{0}', needs.setup.outputs.build_date) }}
    steps:
      - name: 检出源码（用于生成 Changes）
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref_name }}
          fetch-depth: 50

      - name: 下载各机型产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 生成 Release 说明
        run: |
          set -euo pipefail

          # ---- 内核 / SUSFS / BakaSU 版本（取任一机型 meta）----
          META="$(ls dist/*/*-meta.env 2>/dev/null | head -1)"
          if [ -z "${META}" ]; then
            echo "::error::未找到构建元信息 meta.env"; exit 1
          fi
          KV_FULL="$(grep '^KV_FULL=' "${META}" | cut -d= -f2-)"
          SUSFS_VERSION="$(grep '^SUSFS_VERSION=' "${META}" | cut -d= -f2- || true)"
          [ -n "${SUSFS_VERSION}" ] || SUSFS_VERSION="unknown"
          KSU_VERSION="$(grep '^KSU_VERSION=' "${META}" | cut -d= -f2- || true)"
          [ -n "${KSU_VERSION}" ] || KSU_VERSION="unknown"
          echo "KV_FULL=${KV_FULL} | SUSFS=${SUSFS_VERSION} | BakaSU=${KSU_VERSION}"

          git log -10 --pretty=format:'%s (%h)' > "${GITHUB_WORKSPACE}/changes.txt"

          export KV_FULL SUSFS_VERSION KSU_VERSION BUILD_DATE BRANCH
          export OS_SUPPORT ANDROID_SUPPORT TARGETS_JSON
          export IS_BAKASU="${{ (inputs.build_ref || github.ref_name) == 'bakasu-k4.19' && 'true' || 'false' }}"
          python3 - <<'PY'
          import json, os, re

          MANAGER_URL = "https://github.com/Baka-SU/BakaSU/actions/workflows/build-manager.yml?query=branch%3Amain"

          def env(k):
              return os.environ.get(k, "")

          date = env("BUILD_DATE")
          ksu = env("KSU_VERSION"); susfs = env("SUSFS_VERSION")
          kv = env("KV_FULL"); br = env("BRANCH")
          os_support = env("OS_SUPPORT"); android = env("ANDROID_SUPPORT")
          is_bakasu = env("IS_BAKASU") == "true"
          changes = open(os.path.join(env("GITHUB_WORKSPACE"), "changes.txt")).read()

          targets = json.loads(env("TARGETS_JSON") or "[]")
          # base 是冒烟目标，不产出机型 zip，正文里不列
          devices = [t for t in targets if t.get("device_names", "").strip()]

          def base_name(t):
              """矩阵里的机型基名：R9s-bakasu -> R9s。"""
              return re.sub(r"-bakasu$", "", t["target"])

          def zip_name(t):
              """Release 资产里实际的文件名（保留 -bakasu 以区分变体）。"""
              return f"v419_{t['target']}_{date}.zip"

          susfs_num = susfs.lstrip("v") if susfs != "unknown" else susfs

          lines = []
          if is_bakasu:
              lines.append("> OPPO MSM8937 / MSM8953 系列的 **4.19** 内核（BakaSU + SUSFS）。")
          else:
              lines.append("> OPPO MSM8937 / MSM8953 系列的 **4.19** 内核（纯净版，无 root）。")
          lines.append(">")
          lines.append("> 与 4.9 系列并行维护：4.9 分支面向 LineageOS 21 / 22.0 / 22.1，")
          lines.append("> 本 4.19 分支为更新的内核基线，面向 LineageOS 22.1。")
          lines.append("")
          lines.append("### 下载选择")
          lines.append("")
          lines.append("| 内核 | 特性 | 适用场景 | 管理器下载 |")
          lines.append("|---|---|---|---|")
          if is_bakasu:
              lines.append(f"| **BakaSU + SUSFS** | BakaSU (main) / KSU_VERSION {ksu} + SUSFS {susfs} | 需要 SUSFS 隐藏功能、sus mount、sus path 等 | [BakaSU Manager]({MANAGER_URL}) |")
          else:
              lines.append(f"| **纯净内核** | 无 root / 无 KernelSU | 不需要 root，或想自行刷 Magisk | — |")
          lines.append("")
          lines.append("提供格式：")
          lines.append("")
          lines.append("- **.zip** — AnyKernel3 刷入包，通过 recovery (TWRP) 刷入")
          if is_bakasu:
              lines.append("- **.apk** — BakaSU 管理器（内核版本码与之一致），可选安装")
          lines.append("")
          lines.append("### 本次构建")
          lines.append("")
          lines.append("| 机型 | 下载 | 平台 | 内核版本 |")
          lines.append("|---|---|---|---|")
          for d in devices:
              label = re.sub(r"\s*\(.*(BakaSU|root).*\)$", "", d["label"]).strip()
              lines.append(f"| OPPO {label} | `{zip_name(d)}` | {d['soc']} / {d['snapdragon']} | {kv} |")
          lines.append("")
          lines.append("### 共同信息")
          lines.append("")
          dev_names = " / ".join(
              re.sub(r"\s*\(.*(BakaSU|root).*\)$", "", d["label"]).strip() for d in devices
          )
          if dev_names:
              lines.append(f"- **设备**: OPPO {dev_names}")
          lines.append(f"- **系统**: {os_support} (Android {android})")
          lines.append(f"- **内核版本**: {kv} (Non-GKI)")
          lines.append("- **编译器**: ZyCromerZ Clang 13.0.1 + GCC (aarch64/arm)")
          lines.append(f"- **分支**: {br}")
          lines.append("")
          if is_bakasu:
              lines.append(f"### BakaSU (含 SUSFS {susfs_num})")
              lines.append("")
              lines.append("- root 方案: BakaSU（main 分支最新源码）")
              lines.append(f"- KSU_VERSION (内核版本码): {ksu}，与所选管理器 APK 的 versionCode 一致")
              lines.append("- hook 模式: SUSFS Inline Hook (`CONFIG_KSU_SUSFS=y`)")
              lines.append(f"- SUSFS {susfs} (内核侧，保留)")
              lines.append(f"- 管理器: 本页资产里的 `BakaSU_{ksu}_{date}.apk`（与内核 versionCode 一致）")
              lines.append(f"  - 若本页没有该 apk，可从 [BakaSU Build Manager（main 分支）]({MANAGER_URL}) 的 Artifacts 取 `Manager-release`，")
              lines.append(f"    解压后选 versionCode 为 **{ksu}** 的 `*universal-release.apk`；对不上时 Manager 会提示版本不匹配")
              lines.append("")
          lines.append("### 刷入方法")
          lines.append("")
          lines.append("#### 通过 Recovery (TWRP)")
          lines.append("")
          lines.append("1. 下载对应机型的 `v419_*.zip`")
          if is_bakasu:
              lines.append("2. 下载并安装 BakaSU Manager APK（见本页资产）")
          lines.append("3. 重启到 recovery (TWRP)")
          lines.append("4. 刷入对应机型的 zip")
          lines.append("5. 重启")
          if is_bakasu:
              lines.append("6. 打开 Manager 验证驱动检测")
          lines.append("")
          lines.append("### Changes")
          lines.append("")
          lines.append(changes)
          lines.append("")
          lines.append("> 基于 [XuexGao/android_kernel_oppo_msm8937](https://github.com/XuexGao/android_kernel_oppo_msm8937) 自动构建")

          with open(os.path.join(env("GITHUB_WORKSPACE"), "release-body.md"), "w") as f:
              f.write("\n".join(lines) + "\n")
          PY

          echo "---- release-body.md ----"
          cat "${GITHUB_WORKSPACE}/release-body.md"

      # 下载与内核 KSU_VERSION 对齐的 BakaSU 管理器 APK（仅 bakasu 分支，尽力而为）。
      # 与 4.9 工作流一致：从 BakaSU Build Manager 工作流的 Artifacts 取，
      # 取不到只发 notice，绝不影响内核产物与发布。
      - name: 下载 BakaSU 管理器 APK（尽力而为）
        if: (inputs.build_ref || github.ref_name) == 'bakasu-k4.19'
        env:
          GH_TOKEN: ${{ secrets.BAKASU_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PAT: ${{ secrets.BAKASU_TOKEN != '' }}
        run: |
          set -euo pipefail
          META="$(ls dist/*/*-meta.env 2>/dev/null | head -1)"
          APK_VER="$(grep '^KSU_VERSION=' "${META}" | cut -d= -f2- || echo 35257)"
          OUT="${GITHUB_WORKSPACE}/BakaSU_${APK_VER}_${BUILD_DATE}.apk"
          rm -rf /tmp/apk && mkdir -p /tmp/apk

          RUN_ID="$(gh run list --repo Baka-SU/BakaSU \
                      --workflow build-manager.yml --branch main \
                      --status success --limit 1 \
                      --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)"
          echo "Build Manager 最近成功运行: ${RUN_ID:-未找到}"

          if [ -n "${RUN_ID}" ]; then
            gh run download "${RUN_ID}" --repo Baka-SU/BakaSU \
              --name Manager-release --dir /tmp/apk 2>/dev/null || true
          fi

          SRC="$(ls /tmp/apk/*universal-release.apk 2>/dev/null | head -1)"
          if [ -n "${SRC}" ]; then
            cp -v "${SRC}" "${OUT}"
            echo "✅ 管理器 APK 已就绪: $(basename "${OUT}") ($(stat -c%s "${OUT}") bytes)"
          elif [ "${HAS_PAT}" = "true" ]; then
            echo "::warning::已配置 BAKASU_TOKEN 但仍未取到管理器 APK（上游可能没有成功的构建）"
          else
            echo "::notice::未附带管理器 APK，用户可从 BakaSU Build Manager 的 Artifacts 自行获取"
          fi

          ARTIFACTS="dist/**/v419_*.zip"
          if [ -f "${OUT}" ]; then
            ARTIFACTS="${ARTIFACTS},$(basename "${OUT}")"
          fi
          echo "ARTIFACTS=${ARTIFACTS}" >> "$GITHUB_ENV"
          echo "发布资产: ${ARTIFACTS}"

      - name: 对齐 tag 指向本次构建提交
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${TAG_NAME}"
          SHA="${GITHUB_SHA}"
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}"
          if gh api "$api" --silent 2>/dev/null; then
            CUR="$(gh api "$api" --jq '.object.sha')"
            if [ "$CUR" = "$SHA" ]; then
              echo "✅ tag ${TAG} 已指向本次提交 ${SHA:0:10}"
            else
              echo "⚠️ tag ${TAG} 原指向 ${CUR:0:10}，强制对齐到 ${SHA:0:10}"
              gh api -X PATCH "$api" -f sha="$SHA" -F force=true --silent
              echo "✅ tag ${TAG} 已对齐"
            fi
          else
            echo "tag ${TAG} 尚不存在，交由 release-action 创建（commit=${SHA:0:10}）"
          fi

      - name: 发布到 GitHub Releases（合并全部机型 zip）
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          commit: ${{ github.sha }}
          # 必须是小写字符串 "true"（action 内部用 latest === "true" 比较）
          makeLatest: 'true'
          bodyFile: release-body.md
          artifacts: ${{ env.ARTIFACTS }}
          allowUpdates: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
